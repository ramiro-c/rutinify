<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1560" viewBox="0 0 1650 1560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b3d59"/></marker><marker id="arrowLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1650" height="1560" fill="#ffffff"/><text x="825" y="74" text-anchor="middle" font-size="42" font-weight="800" fill="#0b3d59">Ciclo completo del ADLC</text><text x="825" y="116" text-anchor="middle" font-size="19" fill="#475569">Agentic Development Life Cycle · un loop concurrente de seis fases — el agente ejecuta, el humano gobierna</text><line x1="565" y1="140" x2="1085" y2="140" stroke="#cbd5e1" stroke-width="2"/><path d="M 921.1 378.0 Q 1021.6 379.8 1064.8 482.4" fill="none" stroke="#0b3d59" stroke-width="2.6" marker-end="url(#arrow)"/><text x="1007.3" y="405.0" text-anchor="middle" font-size="14" font-weight="600" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">objetivo de generación</text><path d="M 1213.0 755.7 Q 1217.4 929.4 1113.5 1061.8" fill="none" stroke="#0b3d59" stroke-width="2.6" marker-end="url(#arrow)"/><text x="1190.3" y="919.1" text-anchor="middle" font-size="14" font-weight="600" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">expone salida y señal real</text><path d="M 917.1 1158.3 Q 805.2 1216.3 691.9 1158.3" fill="none" stroke="#0b3d59" stroke-width="2.6" marker-end="url(#arrow)"/><text x="804.8" y="1187.3" text-anchor="middle" font-size="14" font-weight="600" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">define límites</text><path d="M 489.3 1070.3 Q 377.1 912.8 374.9 718.2" fill="none" stroke="#0b3d59" stroke-width="2.6" marker-end="url(#arrow)"/><text x="404.6" y="903.6" text-anchor="middle" font-size="14" font-weight="600" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">tráfico real expuesto</text><path d="M 464.6 533.7 Q 526.3 402.3 671.6 383.3" fill="none" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrowLoop)"/><text x="547.2" y="430.4" text-anchor="middle" font-size="14" font-weight="600" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">hipótesis nueva · cierra el loop</text><path d="M 1053.5 1070.3 Q 881.0 746.4 831.4 386.6" fill="none" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#arrowRed)"/><text x="911.7" y="737.4" text-anchor="middle" font-size="14" font-weight="600" fill="#334155" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">REDIRECT · reformular la apuesta</text><path d="M 1216.5071278216737 755.6718427000253 C 1216.5071278216737 833.6718427000253, 1366.5071278216737 833.6718427000253, 1366.5071278216737 755.6718427000253" fill="none" stroke="#d97706" stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#arrowAmber)"/><text x="1291.5071278216737" y="857.6718427000253" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e" paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round">rework · Validate devuelve a Generate</text><clipPath id="clip0"><rect x="635" y="202" width="330" height="176" rx="18"/></clipPath><g clip-path="url(#clip0)"><rect x="635" y="202" width="330" height="176" fill="#ffffff"/><rect x="635" y="202" width="330" height="44" fill="#0b3d59"/><text x="653" y="231" font-size="18" font-weight="700" fill="#ffffff">01 · INTENT</text><text x="949" y="230" font-size="12.5" font-weight="600" fill="#a9cde4" text-anchor="end">Bet Register</text><rect x="635" y="246" width="330" height="66" fill="#eaf0ff"/><circle cx="657" cy="279" r="7" fill="#3355d1"/><text x="677" y="273" font-size="14.5"><tspan font-weight="700" fill="#1d4ed8">HUMANO</tspan><tspan fill="#374151"> · Formula la pregunta y la</tspan></text><text x="677" y="295" font-size="14.5" fill="#374151">hipótesis de negocio.</text><rect x="635" y="312" width="330" height="66" fill="#fff3e2"/><circle cx="657" cy="345" r="7" fill="#e8850c"/><text x="677" y="339" font-size="14.5"><tspan font-weight="700" fill="#b45309">AGENTE</tspan><tspan fill="#374151"> · Mapea alternativas técnicas</tspan></text><text x="677" y="361" font-size="14.5" fill="#374151">y métricas observables.</text></g><rect x="635" y="202" width="330" height="176" rx="18" fill="none" stroke="#0b3d59" stroke-width="2.5"/><clipPath id="clip1"><rect x="1041.5071278216737" y="487.6718427000253" width="430" height="268" rx="18"/></clipPath><g clip-path="url(#clip1)"><rect x="1041.5071278216737" y="487.6718427000253" width="430" height="268" fill="#ffffff"/><rect x="1041.5071278216737" y="487.6718427000253" width="430" height="44" fill="#0b3d59"/><text x="1059.5071278216737" y="516.6718427000253" font-size="18" font-weight="700" fill="#ffffff">02 ⇄ 03 · GENERATE + VALIDATE</text><rect x="1041.5071278216737" y="531.6718427000253" width="430" height="26" fill="#f1f5f9"/><text x="1059.5071278216737" y="549.6718427000253" font-size="12.5" font-style="italic" fill="#64748b">Corren en simultáneo sobre la misma superficie de cambio</text><rect x="1041.5071278216737" y="557.6718427000253" width="430" height="66" fill="#eaf0ff"/><circle cx="1063.5071278216737" cy="590.6718427000253" r="7" fill="#3355d1"/><text x="1083.5071278216737" y="584.6718427000253" font-size="14.5"><tspan font-weight="700" fill="#1d4ed8">HUMANO</tspan><tspan fill="#374151"> · Fija el contexto de intención y</tspan></text><text x="1083.5071278216737" y="606.6718427000253" font-size="14.5" fill="#374151">qué señal resuelve la apuesta.</text><rect x="1041.5071278216737" y="623.6718427000253" width="430" height="66" fill="#fff3e2"/><circle cx="1063.5071278216737" cy="656.6718427000253" r="7" fill="#e8850c"/><text x="1083.5071278216737" y="650.6718427000253" font-size="14.5"><tspan font-weight="700" fill="#b45309">AGENTE · Generator</tspan><tspan fill="#374151"> · Produce código, docs y</tspan></text><text x="1083.5071278216737" y="672.6718427000253" font-size="14.5" fill="#374151">migraciones.</text><rect x="1041.5071278216737" y="689.6718427000253" width="430" height="66" fill="#fff3e2"/><circle cx="1063.5071278216737" cy="722.6718427000253" r="7" fill="#e8850c"/><text x="1083.5071278216737" y="716.6718427000253" font-size="14.5"><tspan font-weight="700" fill="#b45309">AGENTE · Validator</tspan><tspan fill="#374151"> · Genera tests y busca</tspan></text><text x="1083.5071278216737" y="738.6718427000253" font-size="14.5" fill="#374151">bordes y fallas.</text></g><rect x="1041.5071278216737" y="487.6718427000253" width="430" height="268" rx="18" fill="none" stroke="#0b3d59" stroke-width="2.5"/><clipPath id="clip2"><rect x="917.1369211003871" y="1070.328157299975" width="330" height="176" rx="18"/></clipPath><g clip-path="url(#clip2)"><rect x="917.1369211003871" y="1070.328157299975" width="330" height="176" fill="#ffffff"/><rect x="917.1369211003871" y="1070.328157299975" width="330" height="44" fill="#0b3d59"/><text x="935.1369211003871" y="1099.328157299975" font-size="18" font-weight="700" fill="#ffffff">04 · GOVERN</text><rect x="917.1369211003871" y="1114.328157299975" width="330" height="66" fill="#eaf0ff"/><circle cx="939.1369211003871" cy="1147.328157299975" r="7" fill="#3355d1"/><text x="959.1369211003871" y="1141.328157299975" font-size="14.5"><tspan font-weight="700" fill="#1d4ed8">HUMANO</tspan><tspan fill="#374151"> · Emite el veredicto:</tspan></text><text x="959.1369211003871" y="1163.328157299975" font-size="14.5" fill="#374151">ADVANCE / REDIRECT / KILL.</text><rect x="917.1369211003871" y="1180.328157299975" width="330" height="66" fill="#fff3e2"/><circle cx="939.1369211003871" cy="1213.328157299975" r="7" fill="#e8850c"/><text x="959.1369211003871" y="1207.328157299975" font-size="14.5"><tspan font-weight="700" fill="#b45309">AGENTE</tspan><tspan fill="#374151"> · Sintetiza la evidencia:</tspan></text><text x="959.1369211003871" y="1229.328157299975" font-size="14.5" fill="#374151">diff, cobertura y riesgos.</text></g><rect x="917.1369211003871" y="1070.328157299975" width="330" height="176" rx="18" fill="none" stroke="#0b3d59" stroke-width="2.5"/><clipPath id="clip3"><rect x="352.8630788996129" y="1070.328157299975" width="330" height="176" rx="18"/></clipPath><g clip-path="url(#clip3)"><rect x="352.8630788996129" y="1070.328157299975" width="330" height="176" fill="#ffffff"/><rect x="352.8630788996129" y="1070.328157299975" width="330" height="44" fill="#0b3d59"/><text x="370.8630788996129" y="1099.328157299975" font-size="18" font-weight="700" fill="#ffffff">05 · DEPLOY</text><text x="666.8630788996129" y="1098.328157299975" font-size="12.5" font-weight="600" fill="#a9cde4" text-anchor="end">Risk Envelope</text><rect x="352.8630788996129" y="1114.328157299975" width="330" height="66" fill="#eaf0ff"/><circle cx="374.8630788996129" cy="1147.328157299975" r="7" fill="#3355d1"/><text x="394.8630788996129" y="1141.328157299975" font-size="14.5"><tspan font-weight="700" fill="#1d4ed8">HUMANO</tspan><tspan fill="#374151"> · Define el Risk Envelope:</tspan></text><text x="394.8630788996129" y="1163.328157299975" font-size="14.5" fill="#374151">límites de tráfico y rollback.</text><rect x="352.8630788996129" y="1180.328157299975" width="330" height="66" fill="#fff3e2"/><circle cx="374.8630788996129" cy="1213.328157299975" r="7" fill="#e8850c"/><text x="394.8630788996129" y="1207.328157299975" font-size="14.5"><tspan font-weight="700" fill="#b45309">AGENTE</tspan><tspan fill="#374151"> · Orquesta canary, flags y</tspan></text><text x="394.8630788996129" y="1229.328157299975" font-size="14.5" fill="#374151">rollback automático.</text></g><rect x="352.8630788996129" y="1070.328157299975" width="330" height="176" rx="18" fill="none" stroke="#0b3d59" stroke-width="2.5"/><clipPath id="clip4"><rect x="178.4928721783263" y="533.6718427000251" width="330" height="176" rx="18"/></clipPath><g clip-path="url(#clip4)"><rect x="178.4928721783263" y="533.6718427000251" width="330" height="176" fill="#ffffff"/><rect x="178.4928721783263" y="533.6718427000251" width="330" height="44" fill="#0b3d59"/><text x="196.4928721783263" y="562.6718427000251" font-size="18" font-weight="700" fill="#ffffff">06 · OBSERVE</text><rect x="178.4928721783263" y="577.6718427000251" width="330" height="66" fill="#eaf0ff"/><circle cx="200.4928721783263" cy="610.6718427000251" r="7" fill="#3355d1"/><text x="220.4928721783263" y="604.6718427000251" font-size="14.5"><tspan font-weight="700" fill="#1d4ed8">HUMANO</tspan><tspan fill="#374151"> · Interpreta la señal y extrae</tspan></text><text x="220.4928721783263" y="626.6718427000251" font-size="14.5" fill="#374151">los aprendizajes.</text><rect x="178.4928721783263" y="643.6718427000251" width="330" height="66" fill="#fff3e2"/><circle cx="200.4928721783263" cy="676.6718427000251" r="7" fill="#e8850c"/><text x="220.4928721783263" y="670.6718427000251" font-size="14.5"><tspan font-weight="700" fill="#b45309">AGENTE</tspan><tspan fill="#374151"> · Captura telemetría en vivo</tspan></text><text x="220.4928721783263" y="692.6718427000251" font-size="14.5" fill="#374151">y detecta anomalías.</text></g><rect x="178.4928721783263" y="533.6718427000251" width="330" height="176" rx="18" fill="none" stroke="#0b3d59" stroke-width="2.5"/><circle cx="392" cy="1336" r="8" fill="#3355d1"/><text x="414" y="1342" font-size="16" fill="#374151"><tspan font-weight="700" fill="#1d4ed8">Humano</tspan><tspan> — gobierna: define límites, decide, interpreta.</tspan></text><circle cx="922" cy="1336" r="8" fill="#e8850c"/><text x="944" y="1342" font-size="16" fill="#374151"><tspan font-weight="700" fill="#b45309">Agente</tspan><tspan> — ejecuta: genera, verifica, monitorea.</tspan></text><line x1="505" y1="1382" x2="560" y2="1382" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="9 7"/><text x="572" y="1388" font-size="14.5" fill="#374151">Retornos del loop: <tspan font-weight="700" fill="#dc2626">REDIRECT</tspan> (Govern → Intent) y <tspan font-weight="700" fill="#92400e">rework</tspan> (Validate → Generate).</text><text x="825" y="1432" text-anchor="middle" font-size="16.5" font-weight="600" fill="#2563eb">El ciclo no termina en Deploy: Observe realimenta Intent y los retornos reformulan la apuesta.</text></svg>